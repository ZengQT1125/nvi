# 生产部署编排：直接拉取 GHCR 镜像，无需本地构建
# 用法:
#   1) cp .env.example .env （建议修改 ENCRYPTION_KEY、ADMIN_TOKEN）
#   2) docker compose pull && docker compose up -d
services:
  gateway:
    image: ghcr.io/zengqt1125/nvi:latest
    pull_policy: always
    container_name: nvidia-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ENCRYPTION_KEY 有默认值，部署时可自行修改
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      # ADMIN_TOKEN 无默认值，必须通过 .env 提供（历史默认值已移除），缺失会直接报错
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请先在 .env 中设置 ADMIN_TOKEN}
      PORT: 18080
      BACKEND_PORT: 18080
      FRONTEND_PORT: 14000
      API_BASE_URL: http://127.0.0.1:18080
      GATEWAY_DATA_DIR: /app/var/data
    ports:
      - "${BACKEND_PORT:-18080}:18080"
      - "${FRONTEND_PORT:-14000}:14000"
    volumes:
      - gateway_data:/app/var/data
    # 增加 ulimits，避免高并发下文件描述符耗尽导致连接中断
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  gateway_data: