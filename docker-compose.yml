# 生产部署编排：直接拉取 GHCR 镜像，无需本地构建
# 用法: docker compose pull && docker compose up -d
services:
  gateway:
    image: ghcr.io/zengqt1125/nvi:latest
    pull_policy: always
    container_name: nvidia-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-zqt1125}
      PORT: 18080
      BACKEND_PORT: 18080
      FRONTEND_PORT: 14000
      API_BASE_URL: http://127.0.0.1:18080
      GATEWAY_DATA_DIR: /app/var/data
      XRAY_CORE_DIR: /app/bin/xray
      XRAY_BIN_PATH: /app/bin/xray/xray
      XRAY_LOG_LEVEL: ${XRAY_LOG_LEVEL:-error}
      # XRAY_VERSION 已在 GitHub Actions 构建时固化为镜像参数，运行时不需再指定
    ports:
      - "${BACKEND_PORT:-18080}:18080"
      - "${FRONTEND_PORT:-14000}:14000"
    volumes:
      - gateway_data:/app/var/data
    # 增加 ulimits，避免高并发下文件描述符耗尽导致连接中断
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  gateway_data: