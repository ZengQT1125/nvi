name: Build & Push Docker Image (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 注意：GHCR 镜像名必须全小写
  IMAGE_NAME: ghcr.io/zengqt1125/nvi
  PLATFORMS: "linux/arm64"

jobs:
  build-push:
    # 原生 arm64 runner，避免 QEMU 模拟导致构建极慢
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟测试：验证容器能正常启动，后端 /health 与前端页面均可达
      - name: Smoke test container
        run: |
          docker pull ${{ env.IMAGE_NAME }}:latest
          docker run -d --rm --name nvi-smoke \
            -e ADMIN_TOKEN=smoke-test-token \
            -e ENCRYPTION_KEY=12345678901234567890123456789012 \
            -p 18080:18080 -p 14000:14000 \
            ${{ env.IMAGE_NAME }}:latest
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs nvi-smoke 2>&1 | tail -50 || true
            docker rm -f nvi-smoke || true
            echo "backend /health 未就绪，冒烟测试失败" >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:14000 >/dev/null && echo "frontend OK"
          docker rm -f nvi-smoke

      # 清理旧版本镜像，只保留最新 3 个（每次构建后自动执行）
      - name: Cleanup old GHCR images (keep latest 3)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PKG="nvi"
          KEEP=3

          # 判断 owner 是 user 还是 org，选择正确的 API 端点
          API_BASE=""
          if gh api "/users/$OWNER_LC" >/dev/null 2>&1; then
            API_BASE="/users/$OWNER_LC"
          elif gh api "/orgs/$OWNER_LC" >/dev/null 2>&1; then
            API_BASE="/orgs/$OWNER_LC"
          else
            echo "无法确定 $OWNER_LC 的账户类型，跳过清理"
            exit 0
          fi

          echo "包: $OWNER_LC/$PKG (端点: $API_BASE)"

          # 获取所有版本 ID（API 按创建时间倒序返回，最新在前）
          VERSIONS=$(gh api --paginate "$API_BASE/packages/container/$PKG/versions" \
            --jq '.[].id' 2>/dev/null || true)
          TOTAL=$(echo "$VERSIONS" | grep -c . || true)

          echo "找到 $TOTAL 个版本，保留最新 $KEEP 个"

          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "无需清理"
            exit 0
          fi

          COUNT=0
          DELETED=0
          for VID in $VERSIONS; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt "$KEEP" ]; then
              echo "删除版本 #$COUNT (ID: $VID)..."
              if gh api -X DELETE "$API_BASE/packages/container/$PKG/versions/$VID" 2>/dev/null; then
                echo "  已删除"
                DELETED=$((DELETED + 1))
              else
                echo "  删除失败（可能权限不足，跳过）"
              fi
            fi
          done

          echo "清理完成：删除了 $DELETED 个旧版本"